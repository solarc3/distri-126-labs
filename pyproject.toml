[project]
name = "civicmesh"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[tool.setuptools.package-data]
civicmesh = ["comunas_rm.yaml"]

[tool.ruff]
target-version = "py310"

[tool.basedpyright]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
