x-peer-base: &peer-base
  build: .
  environment:
    LOG_LEVEL: INFO
  volumes:
    - ./config.compose.yaml:/app/config.yaml:ro
    - shared_fs:/shared

services:
  # === RED GOSSIP / PUBSUB ===
  peer-1:
    <<: *peer-base
    profiles: ["delitos", "aire"]
    command: ["--config", "/app/config.yaml", "--peer", "peer-1"]

  peer-2:
    <<: *peer-base
    profiles: ["delitos", "aire"]
    command: ["--config", "/app/config.yaml", "--peer", "peer-2"]

  peer-3:
    <<: *peer-base
    profiles: ["delitos", "aire"]
    command: ["--config", "/app/config.yaml", "--peer", "peer-3"]

  # === DOMINIO A (Delitos) ===
  publisher-delitos:
    <<: *peer-base
    profiles: ["delitos"]
    entrypoint: ["python", "-m", "civicmesh.domains.publisher_main"]
    command:
      - "--config"
      - "/app/config.yaml"
      - "--peer"
      - "publisher-delitos"
      - "--dominio"
      - "delitos"
      - "--comuna"
      - "santiago"
    depends_on:
      - peer-1

  # === DOMINIO B (Aire) ===
  publisher-aire:
    <<: *peer-base
    profiles: ["aire"]
    entrypoint: ["python", "-m", "civicmesh.domains.publisher_main"]
    command:
      - "--config"
      - "/app/config.yaml"
      - "--peer"
      - "publisher-aire"
      - "--dominio"
      - "aire"
      - "--comuna"
      - "las_condes"
    depends_on:
      - peer-1

  # === FRONTEND (Métricas) ===
  frontend:
    <<: *peer-base
    profiles: ["delitos", "aire"]
    entrypoint: ["python", "scripts/frontend.py"]
    command: ["--metrics", "/shared", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    volumes:
      - shared_fs:/shared

volumes:
  shared_fs:
