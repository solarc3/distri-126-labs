version: '3.8'

services:
  # === BASE PEER ===
  peer-base: &peer-base
    build: .
    environment:
      - LOG_LEVEL=INFO
    volumes:
      - ./config.example.yaml:/app/config.yaml:ro
      - shared_fs:/shared

  # === RED GOSSIP / PUBSUB ===
  peer-1:
    <<: *peer-base
    profiles: ["delitos", "aire"]
    command: ["--config", "/app/config.yaml", "--port", "5001"]

  peer-2:
    <<: *peer-base
    profiles: ["delitos", "aire"]
    command: ["--config", "/app/config.yaml", "--port", "5002", "--seeds", "peer-1:5001"]

  peer-3:
    <<: *peer-base
    profiles: ["delitos", "aire"]
    command: ["--config", "/app/config.yaml", "--port", "5003", "--seeds", "peer-1:5001,peer-2:5002"]

  # === DOMINIO A (Delitos) ===
  publisher-delitos:
    <<: *peer-base
    profiles: ["delitos"]
    command: ["--config", "/app/config.yaml", "--role", "publisher", "--domain", "delitos", "--seeds", "peer-1:5001"]
    depends_on:
      - peer-1

  # === DOMINIO B (Aire) ===
  publisher-aire:
    <<: *peer-base
    profiles: ["aire"]
    command: ["--config", "/app/config.yaml", "--role", "publisher", "--domain", "aire", "--seeds", "peer-1:5001"]
    depends_on:
      - peer-1

  # === FRONTEND (Métricas) ===
  frontend:
    <<: *peer-base
    profiles: ["delitos", "aire"]
    command: ["--role", "frontend"] # Cambiar cuando el rol analítica implemente su entrypoint
    ports:
      - "8080:8080"
    volumes:
      - shared_fs:/shared

volumes:
  shared_fs:
