name: Agent Docs (Ollama)

on:
  schedule:
    - cron: '0 0 * * 0' # Semanal (Domingos)
  workflow_dispatch:

jobs:
  doc_reviewer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
      - name: Start Ollama Server
        run: |
          ollama serve &
          sleep 5
          ollama pull qwen2.5:0.5b

      - name: Analyze Documentation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Recopilando documentación..."
          cat README.md CHANGELOG.md 2>/dev/null | head -n 500 > docs_context.txt || echo "Documentos no encontrados" > docs_context.txt
          
          PROMPT="Analiza estrictamente estos documentos (README/CHANGELOG):
          
          $(cat docs_context.txt)
          
          DEBES responder ÚNICAMENTE con UNA de estas dos opciones y NADA MÁS:
          OPCIÓN 1: 'Requiere intervención humana: <escribe_aqui_el_motivo_en_1_oracion>' (Úsala si falta explicar la arquitectura pub/sub, faltan parámetros, falta Slurm o Docker).
          OPCIÓN 2: 'La documentación parece estar completa y cumple los requisitos básicos.' (Úsala si ves instrucciones de Slurm, Docker y Frontend).
          
          NO expliques reglas. NO inventes código. Sé directo."
          
          JSON_PAYLOAD=$(jq -n --arg p "$PROMPT" '{model: "qwen2.5:0.5b", prompt: $p, stream: false, options: {temperature: 0.0}}')
          curl -s -X POST http://localhost:11434/api/generate -H "Content-Type: application/json" -d "$JSON_PAYLOAD" | jq -r '.response' > ai_raw.txt
          
          echo -e "**[Agente Documentador]** Revisión de estado de documentación:\n\n$(cat ai_raw.txt)" > issue_body.txt

      - name: Create Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "[IA] Revisión semanal del estado de la documentación" --body-file issue_body.txt --label "documentation" || echo "Fallo al crear issue. Asegúrate de que el token tiene permisos de escritura en issues."
