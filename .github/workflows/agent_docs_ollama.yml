name: Agent Docs (Ollama)

on:
  schedule:
    - cron: '0 0 * * 0' # Semanal (Domingos)
  workflow_dispatch:

jobs:
  doc_reviewer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
      - name: Start Ollama Server
        run: |
          ollama serve &
          sleep 5
          ollama pull llama3.2

      - name: Analyze Documentation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Recopilando documentación..."
          cat README.md CHANGELOG.md 2>/dev/null | head -n 500 > docs_context.txt || echo "Documentos no encontrados" > docs_context.txt
          
          # English prompt with few-shot example and bash fallback
          JSON_PAYLOAD=$(jq -n --arg docs "$(cat docs_context.txt)" '{
            model: "llama3.2",
            messages: [
              {role: "system", content: "You are a strict documentation auditing bot. Your ONLY job is to output a classification string in Spanish. DO NOT explain the text. DO NOT say hello.\n\nIf the documentation lacks instructions on Slurm, Docker Compose, or the general architecture (Gossip/PubSub), output EXACTLY this string and nothing else:\n[IA Docs] Requiere intervención humana. Falta: [list what is missing in spanish]\n\nIf Slurm, Docker and architecture are properly documented, output EXACTLY this string and nothing else:\n[IA Docs] La documentación parece estar completa y cumple los requisitos básicos.\n\nExample Output:\n[IA Docs] La documentación parece estar completa y cumple los requisitos básicos."},
              {role: "user", content: $docs}
            ],
            stream: false, 
            options: {temperature: 0.0}
          }')
          
          RAW_RESP=$(curl -s -X POST http://localhost:11434/api/chat -H "Content-Type: application/json" -d "$JSON_PAYLOAD" | jq -r '.message.content')
          
          echo "Raw AI response: $RAW_RESP"
          
          # Filtro de Seguridad en Bash
          if echo "$RAW_RESP" | grep -q "\[IA Docs\]"; then
            FINAL_TEXT=$(echo "$RAW_RESP" | sed 's/\[IA Docs\] //g')
          else
            FINAL_TEXT="Requiere intervención humana. (El modelo LLM falló al seguir el formato estricto y devolvió texto no estructurado)."
          fi
          
          echo -e "**[Agente Documentador]** Revisión de estado de documentación:\n\n$FINAL_TEXT" > issue_body.txt

      - name: Create Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "[IA] Revisión semanal del estado de la documentación" --body-file issue_body.txt --label "documentation" || echo "Fallo al crear issue."
