name: Agent Docs (Ollama)

on:
  schedule:
    - cron: '0 0 * * 0' # Semanal (Domingos)
  workflow_dispatch:

jobs:
  doc_reviewer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
      - name: Start Ollama Server
        run: |
          ollama serve &
          sleep 5
          ollama pull llama3.2

      - name: Analyze Documentation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Recopilando documentación..."
          cat README.md CHANGELOG.md 2>/dev/null | head -n 500 > docs_context.txt || echo "Documentos no encontrados" > docs_context.txt
          
          # Clean prompt trusting llama3.2
          JSON_PAYLOAD=$(jq -n --arg docs "$(cat docs_context.txt)" '{
            model: "llama3.2", 
            messages: [
              {role: "system", content: "Eres el Agente Documentador de CivicMesh. Analiza los archivos README y CHANGELOG.\nREGLA 1: Si falta documentación sobre cómo correr el clúster con Slurm, levantar Docker Compose, o no se explica la arquitectura general (Gossip/PubSub), responde EXACTAMENTE: 'Requiere intervención humana: <lista brevemente lo que falta>'.\nREGLA 2: Si todos esos temas están explicados, responde EXACTAMENTE: 'La documentación parece estar completa y cumple los requisitos básicos (Slurm, Docker, framework descritos).'\nNO añadas preámbulos ni conclusiones."},
              {role: "user", content: $docs}
            ],
            stream: false, 
            options: {temperature: 0.0}
          }')
          
          RAW_RESP=$(curl -s -X POST http://localhost:11434/api/chat -H "Content-Type: application/json" -d "$JSON_PAYLOAD" | jq -r '.message.content')
          
          echo -e "**[Agente Documentador]** Revisión de estado de documentación:\n\n$RAW_RESP" > issue_body.txt

      - name: Create Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "[IA] Revisión semanal del estado de la documentación" --body-file issue_body.txt --label "documentation" || echo "Fallo al crear issue."
