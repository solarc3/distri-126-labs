name: Agent Docs (Ollama)

on:
  schedule:
    - cron: '0 0 * * 0' # Semanal (Domingos)
  workflow_dispatch:

jobs:
  doc_reviewer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
      - name: Start Ollama Server
        run: |
          ollama serve &
          sleep 5
          ollama pull llama3.2

      - name: Analyze Documentation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Recopilando documentación..."
          cat README.md CHANGELOG.md 2>/dev/null | head -n 500 > docs_context.txt || echo "Documentos no encontrados" > docs_context.txt
          
          # English Prompt
          JSON_PAYLOAD=$(jq -n --arg docs "$(cat docs_context.txt)" '{
            model: "llama3.2", 
            messages: [
              {role: "system", content: "Analyze the provided README and CHANGELOG. You are a strict documentation auditor.\nIf you notice it is missing documentation on how to run the cluster with Slurm, how to start Docker Compose, or lacks an explanation of the general architecture (Gossip/PubSub), reply EXACTLY starting with the word DANGER followed by what is missing.\nIf all those topics (Slurm, Docker, framework description) are present, reply EXACTLY starting with the word SAFE."},
              {role: "user", content: $docs}
            ],
            stream: false, 
            options: {temperature: 0.0}
          }')
          
          RAW_RESP=$(curl -s -X POST http://localhost:11434/api/chat -H "Content-Type: application/json" -d "$JSON_PAYLOAD" | jq -r '.message.content')
          
          echo "Raw AI response: $RAW_RESP"
          
          UPPER_RESP=$(echo "$RAW_RESP" | tr '[:lower:]' '[:upper:]')
          
          if [[ "$UPPER_RESP" == *"DANGER"* ]]; then
             CLEAN_REASON=$(echo "$RAW_RESP" | sed 's/[Dd][Aa][Nn][Gg][Ee][Rr]//g' | sed 's/^[ \t:-]*//' | xargs)
             FINAL_TEXT="Requiere intervención humana: $CLEAN_REASON"
          elif [[ "$UPPER_RESP" == *"SAFE"* ]]; then
             FINAL_TEXT="La documentación parece estar completa y cumple los requisitos básicos (Slurm, Docker, framework descritos)."
          else
             FINAL_TEXT="Requiere intervención humana: No se pudo auditar la documentación correctamente por la IA."
          fi
          
          echo -e "**[Agente Documentador]** Revisión de estado de documentación:\n\n$FINAL_TEXT" > issue_body.txt

      - name: Create Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "[IA] Revisión semanal del estado de la documentación" --body-file issue_body.txt --label "documentation" || echo "Fallo al crear issue."
