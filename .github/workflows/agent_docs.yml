name: Agent Docs (Documentador)

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'civicmesh/**'
      - 'scripts/**'

jobs:
  documenter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Revisor Documentador
        run: |
          echo "Agente Documentador analizando cambios en PR #${{ github.event.pull_request.number }}..."
          echo "Simulando análisis de README y CHANGELOG..."
          # Aquí iría el prompt al LLM (ej. vía gh api o un script custom)
          # Prompt: Revisa los cambios de código e identifica si hay funcionalidades nuevas no documentadas en el README.md o CHANGELOG.md. Si las hay, haz un auto-fix o sugiere el cambio.
