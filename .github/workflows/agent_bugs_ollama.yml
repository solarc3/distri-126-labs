name: Agent Bugs (Ollama)

on:
  schedule:
    - cron: '0 0 * * *' # Diario
  workflow_dispatch:

jobs:
  bug_reviewer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
      - name: Start Ollama Server
        run: |
          ollama serve &
          sleep 5
          ollama pull llama3.2

      - name: Analyze Code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Recopilando código..."
          cat civicmesh/protocol.py civicmesh/node.py 2>/dev/null | head -n 500 > code_context.txt || echo "Código no encontrado" > code_context.txt
          
          # Clean prompt trusting llama3.2
          JSON_PAYLOAD=$(jq -n --arg code "$(cat code_context.txt)" '{
            model: "llama3.2", 
            messages: [
              {role: "system", content: "Eres el Agente Revisor de Bugs de CivicMesh. Analiza el código Python provisto.\nREGLA 1: Si encuentras problemas de concurrencia, deadlocks, sockets mal cerrados o errores lógicos en el ruteo pubsub/gossip, responde EXACTAMENTE: 'Requiere intervención humana. Se han detectado posibles vulnerabilidades o fallos semánticos: [describe el problema en 1 oración]'.\nREGLA 2: Si el código se ve estructuralmente bien o los problemas son puramente estéticos, responde EXACTAMENTE: 'No se encontraron anomalías graves. Auditoría estática: [confirma el estado en 1 oración]'.\nNO agregues ningún texto adicional, saludos o despedidas."},
              {role: "user", content: $code}
            ],
            stream: false, 
            options: {temperature: 0.0}
          }')
          
          RAW_RESP=$(curl -s -X POST http://localhost:11434/api/chat -H "Content-Type: application/json" -d "$JSON_PAYLOAD" | jq -r '.message.content')
          
          echo -e "**[Agente Revisor de Bugs]** Informe de análisis de código base:\n\n$RAW_RESP" > issue_body.txt

      - name: Create Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "[IA] Informe diario de posibles vulnerabilidades o bugs lógicos" --body-file issue_body.txt --label "bug" || echo "Fallo al crear issue."
