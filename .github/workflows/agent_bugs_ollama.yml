name: Agent Bugs (Ollama)

on:
  schedule:
    - cron: '0 0 * * *' # Diario
  workflow_dispatch:

jobs:
  bug_reviewer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
      - name: Start Ollama Server
        run: |
          ollama serve &
          sleep 5
          ollama pull qwen2.5:0.5b

      - name: Analyze Code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Recopilando código..."
          cat civicmesh/protocol.py civicmesh/node.py 2>/dev/null | head -n 500 > code_context.txt || echo "Código no encontrado" > code_context.txt
          
          PROMPT="Analiza este código de Python buscando bugs lógicos o problemas de concurrencia:
          
          $(cat code_context.txt)
          
          DEBES responder ÚNICAMENTE con UNA de estas dos frases y NADA MÁS:
          OPCIÓN 1: 'Requiere intervención humana' (Úsala si encuentras problemas reales de sockets, deadlocks, fallas en protocol.py o node.py).
          OPCIÓN 2: 'No se encontraron anomalías graves.' (Úsala si el código se ve bien o solo hay detalles menores).
          
          Justifica tu elección en una sola oración. NO agregues introducciones ni des sugerencias de código."
          
          JSON_PAYLOAD=$(jq -n --arg p "$PROMPT" '{model: "qwen2.5:0.5b", prompt: $p, stream: false, options: {temperature: 0.0}}')
          curl -s -X POST http://localhost:11434/api/generate -H "Content-Type: application/json" -d "$JSON_PAYLOAD" | jq -r '.response' > ai_raw.txt
          
          echo -e "**[Agente Revisor de Bugs]** Informe de análisis de código base:\n\n$(cat ai_raw.txt)" > issue_body.txt

      - name: Create Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "[IA] Informe diario de posibles vulnerabilidades o bugs lógicos" --body-file issue_body.txt --label "bug" || echo "Fallo al crear issue. Asegúrate de que el token tiene permisos de escritura en issues."
