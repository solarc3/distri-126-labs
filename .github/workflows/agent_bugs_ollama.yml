name: Agent Bugs (Ollama)

on:
  schedule:
    - cron: '0 0 * * *' # Diario
  workflow_dispatch:

jobs:
  bug_reviewer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
      - name: Start Ollama Server
        run: |
          ollama serve &
          sleep 5
          ollama pull qwen2.5:0.5b

      - name: Analyze Code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Recopilando código..."
          cat civicmesh/protocol.py civicmesh/node.py 2>/dev/null | head -n 500 > code_context.txt || echo "Código no encontrado" > code_context.txt
          
          PROMPT="Eres el Agente Revisor de Bugs de CivicMesh. Tu tarea es analizar el código base en busca de vulnerabilidades, problemas de concurrencia, malas prácticas de red o fallas en el protocolo pub/sub o gossip.
          
          Código actual (muestra parcial):
          $(cat code_context.txt)
          
          Reglas de resolución:
          - Identifica si hay algún problema lógico evidente.
          - Si encuentras algo que afecte la lógica central (should_forward, latencia de descubrimiento), debes indicar obligatoriamente: 'Requiere intervención humana'.
          - Si está todo bien o son detalles menores, indica que no se encontraron anomalías graves.
          - Responde de forma técnica y muy breve (máximo 3 oraciones)."
          
          JSON_PAYLOAD=$(jq -n --arg p "$PROMPT" '{model: "qwen2.5:0.5b", prompt: $p, stream: false}')
          curl -s -X POST http://localhost:11434/api/generate -H "Content-Type: application/json" -d "$JSON_PAYLOAD" | jq -r '.response' > ai_raw.txt
          
          echo -e "**[Agente Revisor de Bugs]** Informe de análisis de código base:\n\n$(cat ai_raw.txt)" > issue_body.txt

      - name: Create Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "[IA] Informe diario de posibles vulnerabilidades o bugs lógicos" --body-file issue_body.txt --label "bug" || echo "Fallo al crear issue. Asegúrate de que el token tiene permisos de escritura en issues."
