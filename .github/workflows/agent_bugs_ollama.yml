name: Agent Bugs (Ollama)

on:
  schedule:
    - cron: '0 0 * * *' # Diario
  workflow_dispatch:

jobs:
  bug_reviewer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
      - name: Start Ollama Server
        run: |
          ollama serve &
          sleep 5
          ollama pull llama3.2

      - name: Analyze Code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Recopilando código..."
          cat civicmesh/protocol.py civicmesh/node.py 2>/dev/null | head -n 500 > code_context.txt || echo "Código no encontrado" > code_context.txt
          
          # English prompt with few-shot example and bash fallback
          JSON_PAYLOAD=$(jq -n --arg code "$(cat code_context.txt)" '{
            model: "llama3.2",
            messages: [
              {role: "system", content: "You are a strict code auditing bot. Your ONLY job is to output a classification string in Spanish. DO NOT explain the code. DO NOT say hello.\n\nIf you find concurrency issues, deadlocks, or logic errors in pubsub/gossip, output EXACTLY this string and nothing else:\n[IA Audit] Requiere intervención humana. Posibles vulnerabilidades: [reason in spanish]\n\nIf the code looks structurally fine or issues are purely aesthetic, output EXACTLY this string and nothing else:\n[IA Audit] No se encontraron anomalías graves. Auditoría estática: [reason in spanish]\n\nExample Output:\n[IA Audit] No se encontraron anomalías graves. Auditoría estática: El manejo de sockets está correctamente encapsulado."},
              {role: "user", content: $code}
            ],
            stream: false, 
            options: {temperature: 0.0}
          }')
          
          RAW_RESP=$(curl -s -X POST http://localhost:11434/api/chat -H "Content-Type: application/json" -d "$JSON_PAYLOAD" | jq -r '.message.content')
          
          echo "Raw AI response: $RAW_RESP"
          
          # Filtro de Seguridad en Bash
          if echo "$RAW_RESP" | grep -q "\[IA Audit\]"; then
            FINAL_TEXT=$(echo "$RAW_RESP" | sed 's/\[IA Audit\] //g')
          else
            FINAL_TEXT="Requiere intervención humana.\nJustificación: (El modelo LLM falló al seguir el formato estricto y devolvió texto no estructurado)."
          fi
          
          echo -e "**[Agente Revisor de Bugs]** Informe de análisis de código base:\n\n$FINAL_TEXT" > issue_body.txt

      - name: Create Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "[IA] Informe diario de posibles vulnerabilidades o bugs lógicos" --body-file issue_body.txt --label "bug" || echo "Fallo al crear issue."
