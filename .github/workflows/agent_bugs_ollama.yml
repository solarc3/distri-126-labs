name: Agent Bugs (Ollama)

on:
  schedule:
    - cron: '0 0 * * *' # Diario
  workflow_dispatch:

jobs:
  bug_reviewer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
      - name: Start Ollama Server
        run: |
          ollama serve &
          sleep 5
          ollama pull qwen2.5:0.5b

      - name: Analyze Code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Recopilando código..."
          cat civicmesh/protocol.py civicmesh/node.py 2>/dev/null | head -n 500 > code_context.txt || echo "Código no encontrado" > code_context.txt
          
          # Uso de API Chat + Parser en Bash
          JSON_PAYLOAD=$(jq -n --arg code "$(cat code_context.txt)" '{
            model: "qwen2.5:0.5b", 
            messages: [
              {role: "system", content: "Analiza el código Python de networking provisto. Eres un sistema de auditoría binaria.\nSi encuentras problemas de concurrencia, deadlocks, llamadas a sockets mal cerrados o errores lógicos en el ruteo pubsub/gossip, responde EXACTAMENTE comenzando con la palabra PELIGRO seguida del problema encontrado (1 oración).\nSi el código se ve estructuralmente bien o los problemas son puramente estéticos (nombres de variables, logs), responde EXACTAMENTE comenzando con la palabra SEGURO seguida de un mensaje corto de confirmación."},
              {role: "user", content: $code}
            ],
            stream: false, 
            options: {temperature: 0.0}
          }')
          
          RAW_RESP=$(curl -s -X POST http://localhost:11434/api/chat -H "Content-Type: application/json" -d "$JSON_PAYLOAD" | jq -r '.message.content')
          
          # Parser seguro en Bash
          if [[ "$RAW_RESP" == *"PELIGRO"* ]]; then
             CLEAN_REASON=$(echo "$RAW_RESP" | sed 's/PELIGRO//g' | xargs)
             FINAL_TEXT="Requiere intervención humana.\nSe han detectado posibles vulnerabilidades o fallos semánticos: $CLEAN_REASON"
          elif [[ "$RAW_RESP" == *"SEGURO"* ]]; then
             CLEAN_REASON=$(echo "$RAW_RESP" | sed 's/SEGURO//g' | xargs)
             FINAL_TEXT="No se encontraron anomalías graves.\nAuditoría estática: $CLEAN_REASON"
          else
             FINAL_TEXT="Requiere intervención humana.\nEl modelo detectó ambigüedades y requiere revisión humana."
          fi
          
          echo -e "**[Agente Revisor de Bugs]** Informe de análisis de código base:\n\n$FINAL_TEXT" > issue_body.txt

      - name: Create Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "[IA] Informe diario de posibles vulnerabilidades o bugs lógicos" --body-file issue_body.txt --label "bug" || echo "Fallo al crear issue."
