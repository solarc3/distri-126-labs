name: Agent Bugs (Ollama)

on:
  schedule:
    - cron: '0 0 * * *' # Diario
  workflow_dispatch:

jobs:
  bug_reviewer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
      - name: Start Ollama Server
        run: |
          ollama serve &
          sleep 5
          ollama pull qwen2.5:0.5b

      - name: Analyze Code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Recopilando código..."
          cat civicmesh/protocol.py civicmesh/node.py 2>/dev/null | head -n 500 > code_context.txt || echo "Código no encontrado" > code_context.txt
          
          # English Prompt
          JSON_PAYLOAD=$(jq -n --arg code "$(cat code_context.txt)" '{
            model: "qwen2.5:0.5b", 
            messages: [
              {role: "system", content: "Analyze the provided Python networking code. You are a strict binary auditing system.\nIf you find concurrency issues, deadlocks, poorly closed sockets, or logical errors in pubsub/gossip routing, reply EXACTLY starting with the word DANGER followed by the issue found (1 sentence).\nIf the code looks structurally fine or issues are purely aesthetic (variable names, logs), reply EXACTLY starting with the word SAFE followed by a short confirmation."},
              {role: "user", content: $code}
            ],
            stream: false, 
            options: {temperature: 0.0}
          }')
          
          RAW_RESP=$(curl -s -X POST http://localhost:11434/api/chat -H "Content-Type: application/json" -d "$JSON_PAYLOAD" | jq -r '.message.content')
          
          echo "Raw AI response: $RAW_RESP"
          
          UPPER_RESP=$(echo "$RAW_RESP" | tr '[:lower:]' '[:upper:]')
          
          if [[ "$UPPER_RESP" == *"DANGER"* ]]; then
             CLEAN_REASON=$(echo "$RAW_RESP" | sed 's/[Dd][Aa][Nn][Gg][Ee][Rr]//g' | sed 's/^[ \t:-]*//' | xargs)
             FINAL_TEXT="Requiere intervención humana.\nSe han detectado posibles vulnerabilidades o fallos semánticos: $CLEAN_REASON"
          elif [[ "$UPPER_RESP" == *"SAFE"* ]]; then
             CLEAN_REASON=$(echo "$RAW_RESP" | sed 's/[Ss][Aa][Ff][Ee]//g' | sed 's/^[ \t:-]*//' | xargs)
             FINAL_TEXT="No se encontraron anomalías graves.\nAuditoría estática: $CLEAN_REASON"
          else
             FINAL_TEXT="Requiere intervención humana.\nEl modelo detectó ambigüedades y requiere revisión humana."
          fi
          
          echo -e "**[Agente Revisor de Bugs]** Informe de análisis de código base:\n\n$FINAL_TEXT" > issue_body.txt

      - name: Create Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "[IA] Informe diario de posibles vulnerabilidades o bugs lógicos" --body-file issue_body.txt --label "bug" || echo "Fallo al crear issue."
