name: Ejecutar Laboratorio

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de ejecucion'
        required: true
        type: choice
        default: 'benchmark'
        options:
          - benchmark
          - analysis
          - simulacion

jobs:
  ejecutar:
    runs-on: ubuntu-latest

    steps:
    - name: checkout codigo
      uses: actions/checkout@v3

    - name: instalar dependencias
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libomp-dev python3 python3-pip
        pip3 install matplotlib

    - name: compilar
      run: make

    - name: ejecutar
      run: |
        if [ "${{ github.event.inputs.modo }}" = "analysis" ]; then
          make analysis
        elif [ "${{ github.event.inputs.modo }}" = "benchmark" ]; then
          ./nbody_sim --benchmark
        else
          ./nbody_sim
        fi

    - name: guardar resultados
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: resultados
        path: |
          *.png
          *.dat
