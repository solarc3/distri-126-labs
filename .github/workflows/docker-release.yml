name: Docker release (GHCR)

# Publica la imagen CUDA del simulador en GitHub Container Registry.
# El job `docker-cuda-build` de ci.yml construye la imagen en cada PR pero la
# descarta; este workflow es el que deja una imagen versionada y pulleable,
# necesaria para reproducir los benchmarks del enunciado (seccion 13.2).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Necesario para pushear a GHCR con el GITHUB_TOKEN del propio workflow;
      # sin esto el push falla con 403 aunque el login parezca exitoso.
      packages: write

    steps:
      - name: checkout codigo
        uses: actions/checkout@v4

      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: derivar tags y labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # v2.0.0-lab2 -> tags `v2.0.0-lab2` y `latest`. El tag semver crudo se
          # conserva tal cual porque el sufijo `-lab2` lo hace un pre-release
          # para docker/metadata-action y `type=semver` lo descartaria.
          # El tag `dev-<sha>` cubre workflow_dispatch: por ese camino el ref es
          # refs/heads/<rama>, asi que `type=ref,event=tag` no emite nada y la
          # condicion de `latest` es falsa. Sin el, `tags` queda vacio y
          # build-push-action aborta al pushear sin ningun tag.
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: verificar que la imagen publicada compila y pasa los tests CPU
        # nvcc compila sin GPU fisica, asi que el runner sin GPU alcanza para
        # validar el build; los kernels solo se ejecutan en el nodo del cluster.
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run --rm "${IMAGE}" make test

      - name: resumen
        run: |
          {
            echo "### Imagen publicada"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Uso en un nodo con GPU NVIDIA:"
            echo ""
            echo '```bash'
            echo "docker run --rm --gpus all ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \\"
            echo "  ./nbody_sim --benchmark-gpu --repetitions 10"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
