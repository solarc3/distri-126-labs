name: Agent PR (Ollama)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr_reviewer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
      - name: Start Ollama Server
        run: |
          ollama serve &
          sleep 5
          ollama pull llama3.2

      - name: Get PR Diff and Analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Obteniendo diff del PR..."
          gh pr diff $PR_NUMBER > pr_diff.txt
          head -n 500 pr_diff.txt > diff_short.txt
          
          # Clean prompt trusting llama3.2's instruction following
          JSON_PAYLOAD=$(jq -n --arg diff "$(cat diff_short.txt)" '{
            model: "llama3.2", 
            messages: [
              {role: "system", content: "Eres el Agente Revisor de MR del framework CivicMesh. Tu tarea es analizar el diff de código provisto y clasificar el impacto.\nREGLA 1: Si el código modifica lógica de red, gossip, pubsub, sockets, threads o fanout, tu respuesta debe ser EXACTAMENTE: \"[IA Review] requiere revisión humana. Justificación: [escribe el motivo en 1 oración]\".\nREGLA 2: Si el código solo modifica logs, variables, comentarios, typos, documentación o tests simples, tu respuesta debe ser EXACTAMENTE: \"[IA Review] mecánico y mergeable. Justificación: [escribe el motivo en 1 oración]\".\nBajo NINGUNA circunstancia agregues introducciones, conclusiones o texto adicional."},
              {role: "user", content: $diff}
            ],
            stream: false, 
            options: {temperature: 0.0}
          }')
          
          RAW_RESP=$(curl -s -X POST http://localhost:11434/api/chat -H "Content-Type: application/json" -d "$JSON_PAYLOAD" | jq -r '.message.content')
          
          # Añadir firma formal
          echo -e "**[Agente Revisor de MR]** Análisis de impacto en Pull Request:\n\n$RAW_RESP" > ai_comment.txt

      - name: Comentar en el PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment $PR_NUMBER -F ai_comment.txt
