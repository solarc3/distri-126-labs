name: Agent PR (Ollama)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr_reviewer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
      - name: Start Ollama Server
        run: |
          ollama serve &
          sleep 5
          ollama pull llama3.2

      - name: Get PR Diff and Analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Obteniendo diff del PR..."
          gh pr diff $PR_NUMBER > pr_diff.txt
          head -n 500 pr_diff.txt > diff_short.txt
          
          # English Prompt for better instruction following on 0.5b models
          JSON_PAYLOAD=$(jq -n --arg diff "$(cat diff_short.txt)" '{
            model: "llama3.2", 
            messages: [
              {role: "system", content: "Analyze the provided code diff. You are a strict binary classification system.\nIf the code modifies network logic, gossip, pubsub, sockets, threads, or fanout, reply EXACTLY starting with the word DANGER followed by a brief reason.\nIf the code only modifies logs, variables, comments, typos, documentation, or simple tests, reply EXACTLY starting with the word SAFE followed by a brief reason."},
              {role: "user", content: $diff}
            ],
            stream: false, 
            options: {temperature: 0.0}
          }')
          
          RAW_RESP=$(curl -s -X POST http://localhost:11434/api/chat -H "Content-Type: application/json" -d "$JSON_PAYLOAD" | jq -r '.message.content')
          
          echo "Raw AI response: $RAW_RESP"
          
          # Uppercase for safe string matching
          UPPER_RESP=$(echo "$RAW_RESP" | tr '[:lower:]' '[:upper:]')
          
          # Parser seguro en Bash
          if [[ "$UPPER_RESP" == *"DANGER"* ]]; then
             # Remove DANGER (any case) and leading punctuation
             CLEAN_REASON=$(echo "$RAW_RESP" | sed 's/[Dd][Aa][Nn][Gg][Ee][Rr]//g' | sed 's/^[ \t:-]*//' | xargs)
             FINAL_TEXT="[IA Review] requiere revisión humana.\nJustificación: $CLEAN_REASON"
          elif [[ "$UPPER_RESP" == *"SAFE"* ]]; then
             CLEAN_REASON=$(echo "$RAW_RESP" | sed 's/[Ss][Aa][Ff][Ee]//g' | sed 's/^[ \t:-]*//' | xargs)
             FINAL_TEXT="[IA Review] mecánico y mergeable.\nJustificación: $CLEAN_REASON"
          else
             # Fallback si el modelo sigue alucinando
             FINAL_TEXT="[IA Review] requiere revisión humana.\nJustificación: (El modelo no pudo clasificar unívocamente, requiere revisión por seguridad)."
          fi
          
          # Añadir firma formal
          echo -e "**[Agente Revisor de MR]** Análisis de impacto en Pull Request:\n\n$FINAL_TEXT" > ai_comment.txt

      - name: Comentar en el PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment $PR_NUMBER -F ai_comment.txt
