name: Agent PR (Ollama)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr_reviewer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
      - name: Start Ollama Server
        run: |
          ollama serve &
          sleep 5
          ollama pull qwen2.5:0.5b

      - name: Get PR Diff and Analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Obteniendo diff del PR..."
          gh pr diff $PR_NUMBER > pr_diff.txt
          head -n 500 pr_diff.txt > diff_short.txt
          
          PROMPT="Eres un clasificador estricto. Analiza este diff de código de Python:
          
          $(cat diff_short.txt)
          
          DEBES responder ÚNICAMENTE con UNA de estas dos frases y NADA MÁS:
          OPCIÓN 1: '[IA Review] requiere revisión humana' (Úsala si el código modifica lógica de red, gossip, pubsub, sockets, threads o fanout).
          OPCIÓN 2: '[IA Review] mecánico y mergeable' (Úsala si solo modifica logs, variables, comentarios, typos o tests simples).
          
          Justifica tu elección en una sola oración en la misma línea. NO expliques nada más."
          
          JSON_PAYLOAD=$(jq -n --arg p "$PROMPT" '{model: "qwen2.5:0.5b", prompt: $p, stream: false, options: {temperature: 0.0}}')
          curl -s -X POST http://localhost:11434/api/generate -H "Content-Type: application/json" -d "$JSON_PAYLOAD" | jq -r '.response' > ai_raw.txt
          
          # Añadir firma formal
          echo -e "**[Agente Revisor de MR]** Análisis de impacto en Pull Request:\n\n$(cat ai_raw.txt)" > ai_comment.txt

      - name: Comentar en el PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment $PR_NUMBER -F ai_comment.txt
