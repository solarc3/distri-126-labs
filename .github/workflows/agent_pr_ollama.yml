name: Agent PR (Ollama)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr_reviewer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
      - name: Start Ollama Server
        run: |
          ollama serve &
          sleep 5
          ollama pull llama3.2

      - name: Get PR Diff and Analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Obteniendo diff del PR..."
          gh pr diff $PR_NUMBER > pr_diff.txt
          
          # Llamar al script de Python que mezcla heurística con Ollama
          python scripts/agent_pr.py

      - name: Comentar en el PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment $PR_NUMBER -F ai_comment.txt
