name: Agent PR (Ollama)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr_reviewer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
      - name: Start Ollama Server
        run: |
          ollama serve &
          sleep 5
          ollama pull qwen2.5:0.5b

      - name: Get PR Diff and Analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Obteniendo diff del PR..."
          gh pr diff $PR_NUMBER > pr_diff.txt
          head -n 500 pr_diff.txt > diff_short.txt
          
          # Uso de API Chat + Parser en Bash
          JSON_PAYLOAD=$(jq -n --arg diff "$(cat diff_short.txt)" '{
            model: "qwen2.5:0.5b", 
            messages: [
              {role: "system", content: "Analiza el diff de código provisto. Eres un sistema de clasificación binaria estricta.\nSi el código modifica lógica de red, gossip, pubsub, sockets, threads o fanout, responde EXACTAMENTE comenzando con la palabra PELIGRO seguida de una razón breve.\nSi el código solo modifica logs, variables, comentarios, typos, documentacion o tests simples, responde EXACTAMENTE comenzando con la palabra SEGURO seguida de una razón breve."},
              {role: "user", content: $diff}
            ],
            stream: false, 
            options: {temperature: 0.0}
          }')
          
          RAW_RESP=$(curl -s -X POST http://localhost:11434/api/chat -H "Content-Type: application/json" -d "$JSON_PAYLOAD" | jq -r '.message.content')
          
          # Parser seguro en Bash
          if [[ "$RAW_RESP" == *"PELIGRO"* ]]; then
             CLEAN_REASON=$(echo "$RAW_RESP" | sed 's/PELIGRO//g' | xargs)
             FINAL_TEXT="[IA Review] requiere revisión humana.\nJustificación: $CLEAN_REASON"
          elif [[ "$RAW_RESP" == *"SEGURO"* ]]; then
             CLEAN_REASON=$(echo "$RAW_RESP" | sed 's/SEGURO//g' | xargs)
             FINAL_TEXT="[IA Review] mecánico y mergeable.\nJustificación: $CLEAN_REASON"
          else
             # Fallback si el modelo sigue alucinando
             FINAL_TEXT="[IA Review] requiere revisión humana.\nJustificación: (El modelo no pudo clasificar unívocamente, requiere revisión por seguridad)."
          fi
          
          # Añadir firma formal
          echo -e "**[Agente Revisor de MR]** Análisis de impacto en Pull Request:\n\n$FINAL_TEXT" > ai_comment.txt

      - name: Comentar en el PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment $PR_NUMBER -F ai_comment.txt
