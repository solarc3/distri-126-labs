network:
  peers:
    peer-1:
      bind: "0.0.0.0:7001"
      advertise: "127.0.0.1:7001"
      seeds:
        - "127.0.0.1:7002"
    peer-2:
      bind: "0.0.0.0:7002"
      advertise: "127.0.0.1:7002"
      seeds:
        - "127.0.0.1:7001"
    peer-3:
      bind: "0.0.0.0:7003"
      advertise: "127.0.0.1:7003"
      seeds:
        - "127.0.0.1:7001"

gossip:
  fanout: 1
  interval_seconds: 1.0
  suspect_after_seconds: 10.0
  dead_after_seconds: 20.0
